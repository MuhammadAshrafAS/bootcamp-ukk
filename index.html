<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowState — Kanban & Focus Workspace</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">

        <!-- ═══ HEADER ═══ -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <svg class="logo-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    <span class="logo-text">FlowState</span>
                </div>
                <span class="header-date" id="headerDate"></span>
            </div>

            <div class="header-center">
                <div class="workload-indicator">
                    <div class="workload-top">
                        <span class="workload-label">Today's Load</span>
                        <span class="workload-hours" id="workloadHours">0m</span>
                        <span class="workload-warning" id="workloadWarning"
                            title="Heavy workload — over 6 hours!">⚠</span>
                    </div>
                    <div class="workload-bar">
                        <div class="workload-bar-fill" id="workloadBarFill"></div>
                    </div>
                    <span class="workload-completion" id="completionText">0 of 0 done</span>
                </div>
            </div>

            <div class="header-right">
                <button class="header-btn" id="searchBtn" title="Search (Ctrl+K)">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <kbd>⌘K</kbd>
                </button>
                <button class="header-btn" id="viewToggle" title="Toggle compact view">
                    <svg class="icon-detailed" width="15" height="15" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                    </svg>
                    <svg class="icon-compact" width="15" height="15" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <line x1="3" y1="12" x2="21" y2="12" />
                        <line x1="3" y1="18" x2="21" y2="18" />
                    </svg>
                </button>
                <button class="header-btn" id="themeToggle" title="Toggle dark mode">
                    <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                    </svg>
                    <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                </button>
                <button class="header-btn btn-reset" id="resetBtn" title="Reset to demo data">Reset</button>
                <button class="btn-primary" id="newTaskBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    New Task
                </button>
            </div>
        </header>

        <!-- ═══ FILTER BAR ═══ -->
        <div class="filter-bar">
            <div class="filter-group">
                <span class="filter-label">Priority</span>
                <div class="filter-pills" id="priorityFilters">
                    <button class="filter-pill active" data-priority="all">All</button>
                    <button class="filter-pill" data-priority="high"><span
                            class="priority-dot dot-high"></span>High</button>
                    <button class="filter-pill" data-priority="medium"><span
                            class="priority-dot dot-medium"></span>Medium</button>
                    <button class="filter-pill" data-priority="low"><span
                            class="priority-dot dot-low"></span>Low</button>
                </div>
            </div>
            <div class="filter-group">
                <span class="filter-label">Category</span>
                <div class="filter-pills" id="categoryFilters">
                    <button class="filter-pill active" data-category="all">All</button>
                    <button class="filter-pill" data-category="Dev">Dev</button>
                    <button class="filter-pill" data-category="Design">Design</button>
                    <button class="filter-pill" data-category="Study">Study</button>
                    <button class="filter-pill" data-category="Personal">Personal</button>
                </div>
            </div>
        </div>

        <!-- ═══ KANBAN BOARD ═══ -->
        <main class="board" id="board"></main>

        <!-- ═══ FOCUS BAR ═══ -->
        <div class="focus-bar" id="focusBar">
            <div class="focus-task-info">
                <span class="focus-task-id" id="focusTaskId"></span>
                <span class="focus-task-title" id="focusTaskTitle"></span>
            </div>
            <div class="focus-timer-section">
                <span class="focus-timer" id="focusTimerDisplay">25:00</span>
                <div class="focus-controls">
                    <button class="focus-btn" id="focusStart" title="Start">▶</button>
                    <button class="focus-btn" id="focusPause" title="Pause">⏸</button>
                    <button class="focus-btn" id="focusReset" title="Reset">↺</button>
                </div>
            </div>
            <div class="focus-logged">
                <span class="focus-logged-label">Logged</span>
                <span class="focus-logged-value" id="focusSpent">0m</span>
            </div>
            <button class="focus-close" id="focusClose" title="Close">✕</button>
        </div>

        <!-- ═══ COMMAND PALETTE ═══ -->
        <div class="command-overlay" id="commandOverlay">
            <div class="command-palette">
                <div class="command-input-wrap">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="commandInput" placeholder="Search tasks by title or ID…" autocomplete="off"
                        spellcheck="false">
                    <kbd>Esc</kbd>
                </div>
                <div class="command-results" id="commandResults"></div>
            </div>
        </div>

        <!-- ═══ TASK DRAWER ═══ -->
        <div class="drawer-overlay" id="drawerOverlay">
            <div class="drawer" id="drawer">
                <div class="drawer-header">
                    <h2 id="drawerTitle">New Task</h2>
                    <button class="drawer-close" id="drawerClose">✕</button>
                </div>
                <form class="drawer-form" id="taskForm" autocomplete="off">
                    <div class="form-group">
                        <label for="taskTitleInput">Title</label>
                        <input type="text" id="taskTitleInput" placeholder="What needs to be done?" required>
                    </div>
                    <div class="form-group">
                        <label for="taskDescInput">Description</label>
                        <textarea id="taskDescInput" rows="3" placeholder="Add details…"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="taskPriorityInput">Priority</label>
                            <select id="taskPriorityInput">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskCategoryInput">Category</label>
                            <select id="taskCategoryInput">
                                <option value="Dev">Dev</option>
                                <option value="Design">Design</option>
                                <option value="Study">Study</option>
                                <option value="Personal">Personal</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="taskDueInput">Due Date</label>
                            <input type="date" id="taskDueInput">
                        </div>
                        <div class="form-group">
                            <label for="taskEstimateInput">Estimate (min)</label>
                            <input type="number" id="taskEstimateInput" min="0" step="5" placeholder="45">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="taskColumnInput">Column</label>
                        <select id="taskColumnInput">
                            <option value="inbox">Inbox</option>
                            <option value="today">Today</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sub-tasks</label>
                        <div class="subtask-list" id="subtaskList"></div>
                        <div class="subtask-add">
                            <input type="text" id="subtaskInput" placeholder="Add a sub-task…">
                            <button type="button" id="addSubtaskBtn" class="btn-sm">Add</button>
                        </div>
                    </div>
                    <div class="drawer-actions">
                        <button type="button" class="btn-danger" id="deleteTaskBtn">Delete</button>
                        <div class="drawer-actions-right">
                            <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                            <button type="submit" class="btn-primary">Save Task</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
